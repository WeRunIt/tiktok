<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiktok</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <header>
    <nav>
      <h1>
        <img src="vecteezy_tiktok-logo-on-transparent-background_6057996.jpg" 
             width="50px" height="50px" alt="TikTok Logo">
      </h1>
    </nav>
  </header>

  <main>
    <div id="form1">
      <form method="POST" action="/register">
        <center><h3 style="font-weight: 400;">Log in</h3></center>
        <br>
        <!-- Add name="email" -->
        <input type="email" name="email" placeholder="رقم الهاتف أو البريد الإلكتروني" required><br>
        <!-- Add name="password" -->
        <input type="password" name="password" placeholder="كلمة المرور" required><br>
        <a href="index2.html">
          <p style="margin-block: 2%;">هل نسيت كلمة السر</p>
        </a>
        <button style="background-color: red; color: white; outline: none;
                       border: none; padding: 3%;" type="submit">
          Log in
        </button>
      </form>
    </div>
  </main>

  <footer>
    <center>
      Don't have an account? 
      <span style="text-decoration: underline; color: red;">sign up</span>
    </center>
  </footer>
</body>
</html>
